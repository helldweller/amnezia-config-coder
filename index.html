<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Keys never leave the page: no network access except the pinned QR library. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'">
<title>Amnezia Config Coder</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f6f8; --fg: #1a1d21; --muted: #6b7280; --card: #fff;
    --line: #d9dde3; --accent: #4f46e5; --err: #dc2626; --ok: #16a34a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1115; --fg: #e6e8eb; --muted: #9aa1ab; --card: #171a20;
      --line: #2a2f38; --accent: #818cf8; --err: #f87171; --ok: #4ade80;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  [role=tablist] { display: flex; position: sticky; top: 0; z-index: 1; }
  [role=tab] {
    flex: 1; padding: 18px 16px; border: 0; border-bottom: 3px solid var(--line);
    background: var(--card); color: var(--muted); font: 600 22px system-ui, sans-serif; cursor: pointer;
  }
  [role=tab][aria-selected=true] { color: var(--fg); border-bottom-color: var(--accent); }
  [role=tab]:focus-visible { outline: 2px solid var(--accent); outline-offset: -4px; }
  @media (max-width: 600px) { [role=tab] { padding: 14px 6px; font-size: 16px; } }
  main { max-width: 1600px; margin: 0 auto; padding: 4px 16px 8px; }
  label, h2 { display: block; font-weight: 600; font-size: inherit; margin: 14px 0 6px; }
  textarea {
    display: block; width: 100%; min-height: 100px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--fg); font: 13px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace;
    resize: vertical; word-break: break-all;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  textarea.big { min-height: 280px; word-break: normal; }
  .row { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
  .status { font-size: 13px; color: var(--ok); }
  .status.err { color: var(--err); }
  button.btn {
    padding: 7px 16px; border: 1px solid var(--line); border-radius: 6px;
    background: var(--card); color: var(--fg); font: inherit; cursor: pointer;
  }
  button.btn:hover:enabled { border-color: var(--accent); }
  .seg { display: flex; margin: 14px 0 6px; }
  .seg button { flex: 1; border-radius: 0; }
  .seg button:first-child { border-radius: 6px 0 0 6px; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button + button { border-left: 0; }
  .head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
  button.small { padding: 2px 12px; font-size: 13px; margin-bottom: 5px; }
  input, select {
    display: block; width: 100%; padding: 8px 12px; border: 1px solid var(--line); border-radius: 8px;
    background: var(--card); color: var(--fg); font: 14px ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .note { color: var(--muted); font-size: 13px; margin: 14px 0 0; }
  .seg button[aria-pressed=true] { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seg button:disabled { color: var(--muted); cursor: default; }
  .qr-img { width: min(100%, 420px); margin: 0 auto; }
  .qr-img svg { display: block; width: 100%; height: auto; shape-rendering: crispEdges; }
  .qr-label { text-align: center; color: var(--muted); font-size: 13px; margin: 0 0 8px; min-height: 1.5em; }
  footer { text-align: center; color: var(--muted); font-size: 12px; padding: 4px 16px 8px; }
  footer a { color: inherit; }

  /* Desktop: the whole tab fits one screen, text on the left stretches, QR on the right scales to the space left. */
  @media (min-width: 900px) {
    body { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
    main { flex: 1; min-height: 0; width: 100%; }
    section { height: 100%; display: flex; flex-direction: column; }
    .cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
    .col, .grow { display: flex; flex-direction: column; min-height: 0; }
    .grow { flex: 1; }
    .grow textarea { flex: 1; min-height: 80px; resize: none; }
    .qr-img { flex: 1; min-height: 0; width: 100%; }
    .qr-img svg { height: 100%; }
  }
</style>
</head>
<body>
<nav role="tablist">
  <button role="tab" id="tab-dec" aria-controls="dec" aria-selected="true">Decoder</button>
  <button role="tab" id="tab-enc" aria-controls="enc" aria-selected="false">Encoder</button>
  <button role="tab" id="tab-gen" aria-controls="gen" aria-selected="false">I1 generator</button>
</nav>
<main>
  <section role="tabpanel" id="dec" aria-labelledby="tab-dec">
    <div class="head"><label for="dec-in">vpn:// key</label><button class="btn small" data-clear="dec-in">Clear</button></div>
    <textarea id="dec-in" rows="3" spellcheck="false" placeholder="vpn://..."></textarea>
    <div class="cols">
      <div class="col">
        <div class="grow">
          <label for="dec-out">Config JSON</label>
          <textarea id="dec-out" class="big" readonly></textarea>
          <div class="row"><span class="status" id="dec-status" role="status"></span><button class="btn" data-copy="dec-out">Copy</button></div>
        </div>
        <div class="grow" id="dec-wg" hidden>
          <label for="dec-conf">WireGuard / AmneziaWG config</label>
          <textarea id="dec-conf" class="big" readonly></textarea>
          <div class="row"><span></span><span><button class="btn" data-copy="dec-conf">Copy</button> <button class="btn" id="dec-download">Download .conf</button></span></div>
        </div>
      </div>
      <div class="col" id="dec-qr">
        <div class="seg" role="group" aria-label="QR code for">
          <button class="btn" data-mode="vpn" aria-pressed="true">AmneziaVPN</button>
          <button class="btn" data-mode="wg" aria-pressed="false">AmneziaWG / WireGuard</button>
        </div>
        <p class="qr-label"></p><div class="qr-img"></div>
      </div>
    </div>
  </section>
  <section role="tabpanel" id="enc" aria-labelledby="tab-enc" hidden>
    <div class="cols">
      <div class="col">
        <div class="grow">
          <div class="head"><label for="enc-in">Config JSON or AmneziaWG .conf</label><button class="btn small" data-clear="enc-in">Clear</button></div>
          <textarea id="enc-in" class="big" spellcheck="false" placeholder='{"containers": [...], "hostName": "..."}'></textarea>
        </div>
        <label for="enc-out">vpn:// key</label>
        <textarea id="enc-out" readonly></textarea>
        <div class="row"><span class="status" id="enc-status" role="status"></span><button class="btn" data-copy="enc-out">Copy</button></div>
      </div>
      <div class="col" id="enc-qr">
        <h2 id="enc-qr-title">QR code</h2>
        <p class="qr-label"></p><div class="qr-img"></div>
      </div>
    </div>
  </section>
  <section role="tabpanel" id="gen" aria-labelledby="tab-gen" hidden>
    <div class="cols">
      <div class="col">
        <div class="seg" role="group" aria-label="Protocol to mimic">
          <button class="btn" data-proto="quic" aria-pressed="true">QUIC</button>
          <button class="btn" data-proto="stun" aria-pressed="false">STUN / WebRTC</button>
          <button class="btn" data-proto="dns" aria-pressed="false">DNS</button>
        </div>
        <div data-for="quic">
          <label for="gen-sni">SNI, the site name inside the TLS ClientHello</label>
          <input id="gen-sni" value="www.google.com" spellcheck="false" autocomplete="off">
        </div>
        <div data-for="dns" hidden>
          <label for="gen-domain">Domain to query</label>
          <input id="gen-domain" value="google.com" spellcheck="false" autocomplete="off">
          <label for="gen-type">Record type</label>
          <select id="gen-type"><option>A</option><option>AAAA</option><option>HTTPS</option></select>
        </div>
        <p class="note" id="gen-note"></p>
        <p class="note">Put the value into I1 in the AmneziaVPN client settings. When editing a config JSON, change both the I1 field of last_config and the I1 line of its config text.</p>
      </div>
      <div class="col">
        <div class="grow">
          <label for="gen-out">I1</label>
          <textarea id="gen-out" class="big" readonly></textarea>
          <div class="row"><span class="status" id="gen-status" role="status"></span><span><button class="btn" id="gen-new">Regenerate</button> <button class="btn" data-copy="gen-out">Copy</button></span></div>
        </div>
      </div>
    </div>
  </section>
</main>
<footer>Runs entirely in your browser, nothing is sent anywhere. <a href="https://github.com/helldweller/amnezia-config-coder">Source</a></footer>

<script id="core">
// vpn:// key = "vpn://" + base64url(qCompress(json)), qCompress = uint32 BE length + zlib stream.
// API keys put the signature 000000ff in place of the length and keep base64 padding; both decode the same way.
const pipe = async (bytes, stream) =>
  new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(stream)).arrayBuffer());
const isJson = s => /^\s*\{/.test(s); // Amnezia configs are objects; anything else is raw .conf text
const fromB64 = s => Uint8Array.from(atob(s.replace(/[\s=]/g, '').replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
const toB64url = bytes =>
  btoa(Array.from(bytes, b => String.fromCharCode(b)).join('')).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const stripScheme = key => key.trim().replace(/^vpn:\/\//i, '');

async function decode(key) {
  let bytes;
  try { bytes = fromB64(stripScheme(key)); }
  catch { throw new Error('Not a vpn:// key: invalid base64'); }
  let text;
  try { text = new TextDecoder().decode(await pipe(bytes.subarray(4), new DecompressionStream('deflate'))); }
  catch {
    // The app also accepts uncompressed payloads.
    try { text = new TextDecoder('utf-8', { fatal: true }).decode(bytes); }
    catch { throw new Error('Not a vpn:// key: payload is neither zlib nor text'); }
  }
  try { return JSON.stringify(JSON.parse(text), null, 2); } catch { return text; }
}

async function encode(input) {
  if (/^\s*vpn:\/\//i.test(input)) throw new Error('This is already a vpn:// key, paste it into Decoder');
  const data = new TextEncoder().encode(isJson(input) ? JSON.stringify(JSON.parse(input)) : input);
  const z = await pipe(data, new CompressionStream('deflate'));
  const out = new Uint8Array(4 + z.length);
  new DataView(out.buffer).setUint32(0, data.length);
  out.set(z, 4);
  return 'vpn://' + toB64url(out);
}

// Port of qrCodeUtils::generateQrCodeImageSeries: the qCompress bytes are cut into 850-byte chunks,
// each framed by QDataStream as int16 magic 1984, uint8 count, uint8 index, uint32 length + bytes, then base64url.
function qrSeries(key) {
  const bytes = fromB64(stripScheme(key)), K = 850, count = Math.ceil(bytes.length / K);
  return Array.from({ length: count }, (_, i) => {
    const part = bytes.subarray(i * K, (i + 1) * K), chunk = new Uint8Array(8 + part.length), v = new DataView(chunk.buffer);
    v.setInt16(0, 1984); v.setUint8(2, count); v.setUint8(3, i); v.setUint32(4, part.length);
    chunk.set(part, 8);
    return toB64url(chunk);
  });
}

// The app keeps the client .conf in containers[].<protocol>.last_config (a JSON string) under "config",
// with DNS left as $PRIMARY_DNS/$SECONDARY_DNS; export fills them from dns1/dns2 (app defaults otherwise).
function wgConf(text) {
  let cfg;
  try { cfg = JSON.parse(text); } catch { return text.includes('[Interface]') ? text : ''; }
  const rank = c => (c.container === cfg.defaultContainer ? 0 : 1);
  for (const c of [...(cfg.containers || [])].sort((a, b) => rank(a) - rank(b))) {
    for (const proto of Object.values(c)) {
      let conf;
      try { conf = JSON.parse(proto.last_config).config; } catch { continue; }
      if (typeof conf === 'string' && conf.includes('[Interface]'))
        return conf.replaceAll('$PRIMARY_DNS', cfg.dns1 || '1.1.1.1').replaceAll('$SECONDARY_DNS', cfg.dns2 || '1.0.0.1');
    }
  }
  return '';
}

// ---- I1 generator: a UDP payload sent before every handshake, written in AmneziaWG tag syntax. ----
const hex = bytes => Array.from(bytes, b => b.toString(16).padStart(2, '0')).join('');
const cat = (...parts) => {
  const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
  parts.reduce((offset, p) => (out.set(p, offset), offset + p.length), 0);
  return out;
};
const u8 = (...bytes) => new Uint8Array(bytes);
const u16 = n => u8(n >> 8, n & 255);
const ascii = s => new TextEncoder().encode(s);
const vec8 = b => cat(u8(b.length), b), vec16 = b => cat(u16(b.length), b);
const varint = n => (n < 64 ? u8(n) : n < 16384 ? u16(0x4000 | n) : u8(0x80 | n >>> 24, n >> 16 & 255, n >> 8 & 255, n & 255));

// Byte size of an I1 value once its tags are expanded.
const i1Size = i1 => [...i1.matchAll(/<(\w+) ?([^>]*)>/g)]
  .reduce((n, [, tag, arg]) => n + (tag === 'b' ? (arg.length - 2) / 2 : tag === 't' ? 4 : +arg), 0);

function hostname(input) {
  let h = '';
  try { h = new URL(`http://${input.trim()}`).hostname; } catch {} // lowercases and punycodes IDN
  const label = '(?!-)[a-z0-9-]{1,63}(?<!-)';
  if (h.length > 253 || /^[\d.]+$/.test(h) || !new RegExp(`^${label}(\\.${label})+$`).test(h)) throw new Error('Enter a domain like example.com');
  return h;
}

// DNS query as an OS resolver sends it: random ID, recursion desired, one question, EDNS0 OPT record (UDP size 1232).
function i1Dns(domain, type) {
  const qname = cat(...hostname(domain).split('.').map(l => vec8(ascii(l))), u8(0));
  const qtype = { A: 1, AAAA: 28, HTTPS: 65 }[type];
  return `<r 2><b 0x${hex(cat(u8(1, 0, 0, 1, 0, 0, 0, 0, 0, 1), qname, u16(qtype), u16(1), u8(0, 0, 41, 4, 208, 0, 0, 0, 0, 0, 0)))}>`;
}

// STUN Binding Request (RFC 8489) as browsers send it to STUN servers: magic cookie and a random 12-byte transaction ID.
const i1Stun = () => '<b 0x000100002112a442><r 12>';

// QUIC v1 keys (RFC 9001 §5.2): HKDF-Extract with the v1 salt, then HKDF-Expand-Label; each output fits one HMAC block.
const QUIC_SALT = u8(0x38, 0x76, 0x2c, 0xf7, 0xf5, 0x59, 0x34, 0xb3, 0x4d, 0x17, 0x9a, 0xe6, 0xa4, 0xc8, 0x0c, 0xad, 0xcc, 0xbb, 0x7f, 0x0a);
const hmac = async (key, data) =>
  new Uint8Array(await crypto.subtle.sign('HMAC', await crypto.subtle.importKey('raw', key, { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']), data));
const expandLabel = async (secret, label, len) => (await hmac(secret, cat(u16(len), vec8(ascii(`tls13 ${label}`)), u8(0, 1)))).subarray(0, len);
async function quicKeys(dcid) {
  const client = await expandLabel(await hmac(QUIC_SALT, dcid), 'client in', 32);
  return { key: await expandLabel(client, 'quic key', 16), iv: await expandLabel(client, 'quic iv', 12), hp: await expandLabel(client, 'quic hp', 16) };
}

// QUIC v1 client Initial carrying a TLS 1.3 ClientHello for `sni`, padded to 1250 bytes like Chrome. It is really
// encrypted, so DPI that decrypts Initials sees a valid handshake. Tags cannot re-encrypt it per handshake,
// so its bytes are fixed: generate a separate one per server.
async function i1Quic(sni) {
  const random = n => crypto.getRandomValues(new Uint8Array(n));
  const ext = (type, body) => cat(u16(type), vec16(body));
  const param = (id, value) => cat(varint(id), vec8(value)); // values stay under 64 bytes, so the length is a 1-byte varint
  const keyShare = random(32);
  keyShare[31] &= 0x7f; // x25519 public keys are below 2^255
  const transport = cat(
    param(0x01, varint(30000)), param(0x03, varint(1472)), param(0x04, varint(15728640)), param(0x05, varint(6291456)),
    param(0x06, varint(6291456)), param(0x07, varint(6291456)), param(0x08, varint(100)), param(0x09, varint(103)),
    param(0x0f, u8()), // initial_source_connection_id: empty, matching the empty SCID below
  );
  const hello = cat(u16(0x0303), random(32), u8(0), vec16(cat(u16(0x1301), u16(0x1302), u16(0x1303))), u8(1, 0), vec16(cat(
    ext(0x0000, vec16(cat(u8(0), vec16(ascii(hostname(sni)))))),                          // server_name
    ext(0x000a, vec16(cat(u16(0x001d), u16(0x0017), u16(0x0018)))),                      // supported_groups
    ext(0x000d, vec16(cat(...[0x0403, 0x0804, 0x0401, 0x0503, 0x0805, 0x0501, 0x0806, 0x0601].map(u16)))), // signature_algorithms
    ext(0x0010, vec16(vec8(ascii('h3')))),                                               // ALPN
    ext(0x002b, vec8(u16(0x0304))),                                                      // supported_versions: TLS 1.3
    ext(0x002d, vec8(u8(1))),                                                            // psk_key_exchange_modes
    ext(0x0033, vec16(cat(u16(0x001d), vec16(keyShare)))),                               // key_share: x25519
    ext(0x0039, transport),                                                              // quic_transport_parameters
  )));
  const frame = cat(u8(6), varint(0), varint(hello.length + 4), u8(1, 0), u16(hello.length), hello); // CRYPTO frame
  // 18-byte header (Initial, v1, 8-byte DCID, empty SCID and token, 2-byte length) + 1-byte packet number + payload + 16-byte tag = 1250.
  const dcid = random(8), pn = 1;
  const header = cat(u8(0xc0, 0, 0, 0, 1), vec8(dcid), u8(0, 0), u16(0x4000 | 1232), u8(pn));
  const plain = new Uint8Array(1215); // zeros after the CRYPTO frame are PADDING frames
  plain.set(frame);
  const { key, iv, hp } = await quicKeys(dcid);
  const nonce = iv.slice();
  nonce[11] ^= pn;
  const sealed = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-GCM', iv: nonce, additionalData: header },
    await crypto.subtle.importKey('raw', key, 'AES-GCM', false, ['encrypt']), plain));
  // Header protection: AES-ECB of the 16 bytes starting 4 after the packet number, done as one CBC block with a zero IV.
  const mask = new Uint8Array(await crypto.subtle.encrypt({ name: 'AES-CBC', iv: new Uint8Array(16) },
    await crypto.subtle.importKey('raw', hp, 'AES-CBC', false, ['encrypt']), sealed.subarray(3, 19)));
  const packet = cat(header, sealed);
  packet[0] ^= mask[0] & 0x0f;
  packet[header.length - 1] ^= mask[1];
  return `<b 0x${hex(packet)}>`;
}
</script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js" integrity="sha384-8FWZA6BGMXhsfO+BLtrJK0We6gg5o1JyO8xQm6peWDEUs17ACA5ziE/NIAkl9z2k" crossorigin="anonymous"></script>
<script>
const $ = id => document.getElementById(id);
const tabs = document.querySelectorAll('[role=tab]');
tabs.forEach(tab => tab.onclick = () => tabs.forEach(t => {
  t.setAttribute('aria-selected', t === tab);
  $(t.getAttribute('aria-controls')).hidden = t !== tab;
}));

function live(inId, outId, statusId, fn, render) {
  let seq = 0;
  $(inId).oninput = async () => {
    const n = ++seq, input = $(inId).value, status = $(statusId);
    let out = '', msg = '', err = false;
    if (input.trim()) {
      try { out = await fn(input); msg = `OK, ${out.length} chars`; }
      catch (e) { msg = e.message; err = true; }
    }
    if (n !== seq) return; // a newer keystroke already won
    $(outId).value = out; status.textContent = msg; status.className = err ? 'status err' : 'status';
    render(input, out);
  };
}

const qrSvg = text => {
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8']; // here, so a failed CDN load only breaks QR
  const qr = qrcode(0, 'L'); // same ECC level as the app
  qr.addData(text);
  qr.make();
  return qr.createSvgTag({ cellSize: 1, margin: 4, scalable: true }).replace('xMinYMin', 'xMidYMin');
};
function showQr(box, texts) {
  clearInterval(box.timer);
  const img = box.querySelector('.qr-img'), label = box.querySelector('.qr-label');
  img.innerHTML = '';
  label.textContent = texts.length ? '' : 'QR code appears here';
  if (!texts.length) return;
  let svgs;
  try { svgs = texts.map(qrSvg); }
  catch (e) { label.textContent = `No QR: ${e.message || e}`; return; }
  let i = 0;
  const step = () => {
    img.innerHTML = svgs[i];
    label.textContent = svgs.length > 1 ? `Code ${i + 1} of ${svgs.length}, scan until the app collects all` : '';
    i = (i + 1) % svgs.length;
  };
  step();
  if (svgs.length > 1) box.timer = setInterval(step, 1000); // same interval as the app
}

// Decoder QR: AmneziaVPN scans a chunk series of the key, AmneziaWG/WireGuard apps scan the plain .conf text.
const decQr = { vpn: [], wg: [], mode: 'vpn' };
const segs = document.querySelectorAll('#dec-qr [data-mode]');
function renderDecQr() {
  if (!decQr.wg.length) decQr.mode = 'vpn';
  segs.forEach(b => {
    b.setAttribute('aria-pressed', b.dataset.mode === decQr.mode);
    b.disabled = !decQr[b.dataset.mode].length;
  });
  showQr($('dec-qr'), decQr[decQr.mode]);
}
segs.forEach(b => b.onclick = () => { decQr.mode = b.dataset.mode; renderDecQr(); });

live('dec-in', 'dec-out', 'dec-status', decode, (input, json) => {
  const conf = json ? wgConf(json) : '';
  $('dec-wg').hidden = !conf;
  $('dec-conf').value = conf;
  decQr.vpn = json ? qrSeries(input) : [];
  decQr.wg = conf ? [conf] : [];
  renderDecQr();
});
live('enc-in', 'enc-out', 'enc-status', encode, (input, key) => {
  $('enc-qr-title').textContent = !key ? 'QR code' : isJson(input) ? 'QR for AmneziaVPN' : 'QR for AmneziaWG / WireGuard';
  showQr($('enc-qr'), !key ? [] : isJson(input) ? qrSeries(key) : [input]);
});
renderDecQr();
showQr($('enc-qr'), []);

document.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => {
  const field = $(b.dataset.clear);
  field.value = '';
  field.dispatchEvent(new Event('input'));
  field.focus();
});

const GEN = {
  quic: {
    make: () => i1Quic($('gen-sni').value),
    note: 'A real QUIC v1 Initial (1250 bytes, like Chrome) with a TLS ClientHello for this SNI, so DPI that decrypts Initials sees a valid handshake. Its bytes are fixed, so generate a separate one per server. Best with server port UDP 443.',
  },
  stun: {
    make: async () => i1Stun(),
    note: 'A STUN Binding Request (20 bytes), as browsers send to STUN servers before a call. The transaction ID is random on every handshake. Requests carry no addresses, so there is nothing to fill in. Best with server port UDP 3478.',
  },
  dns: {
    make: async () => i1Dns($('gen-domain').value, $('gen-type').value),
    note: 'A DNS query as an OS resolver sends it, with EDNS and a random ID on every handshake. Best with server port UDP 53, but many ISPs intercept port 53.',
  },
};
let genProto = 'quic', genSeq = 0;
async function generate() {
  const n = ++genSeq, status = $('gen-status');
  document.querySelectorAll('[data-proto]').forEach(b => b.setAttribute('aria-pressed', b.dataset.proto === genProto));
  document.querySelectorAll('[data-for]').forEach(d => d.hidden = d.dataset.for !== genProto);
  $('gen-note').textContent = GEN[genProto].note;
  let out = '', msg = '', err = false;
  try {
    out = await GEN[genProto].make();
    const size = i1Size(out);
    msg = size > 1400 ? `${size} bytes, may fragment on small-MTU links` : `${size} bytes`;
  } catch (e) { msg = e.message; err = true; }
  if (n !== genSeq) return; // a newer input already won
  $('gen-out').value = out; status.textContent = msg; status.className = err ? 'status err' : 'status';
}
document.querySelectorAll('[data-proto]').forEach(b => b.onclick = () => { genProto = b.dataset.proto; generate(); });
['gen-sni', 'gen-domain', 'gen-type'].forEach(id => $(id).oninput = generate);
$('gen-new').onclick = generate;
generate();

document.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => {
  await navigator.clipboard.writeText($(b.dataset.copy).value);
  b.textContent = 'Copied';
  setTimeout(() => b.textContent = 'Copy', 1200);
});

$('dec-download').onclick = () => {
  let cfg = {};
  try { cfg = JSON.parse($('dec-out').value); } catch {}
  // wg-quick takes the interface name from the file name: [a-zA-Z0-9_=+.-], 15 chars max.
  const name = [cfg.description, cfg.hostName, 'amnezia'].map(s => String(s || '').replace(/[^\w=+.-]/g, '')).find(Boolean).slice(0, 15);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([$('dec-conf').value], { type: 'text/plain' }));
  a.download = `${name}.conf`;
  a.click();
};
</script>
</body>
</html>
